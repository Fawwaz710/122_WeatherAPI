<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather Location Search</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #0f172a, #1d4ed8);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #e2e8f0;
      }

      .container {
        width: min(900px, 90%);
        background: rgba(15, 23, 42, 0.8);
        border: 1px solid rgba(148, 163, 184, 0.3);
        border-radius: 24px;
        padding: 30px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
        backdrop-filter: blur(10px);
      }

      .header {
        text-align: center;
        margin-bottom: 25px;
      }

      .header h1 {
        margin: 0 0 10px;
        font-size: 2rem;
      }

      .header p {
        margin: 0;
        color: #cbd5e1;
      }

      .search-box {
        display: flex;
        gap: 12px;
        margin-bottom: 25px;
      }

      .search-box input {
        flex: 1;
        padding: 14px 16px;
        border-radius: 12px;
        border: 1px solid #64748b;
        background: rgba(15, 23, 42, 0.9);
        color: white;
        font-size: 1rem;
      }

      .search-box button {
        padding: 14px 24px;
        border: none;
        border-radius: 12px;
        background: linear-gradient(135deg, #38bdf8, #2563eb);
        color: white;
        font-weight: bold;
        cursor: pointer;
      }

      .result-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 18px;
      }

      .card {
        background: rgba(30, 41, 59, 0.9);
        border-radius: 18px;
        padding: 18px;
        border: 1px solid rgba(148, 163, 184, 0.25);
      }

      .label {
        display: block;
        color: #94a3b8;
        margin-bottom: 8px;
        font-size: 0.8rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }

      .value {
        font-size: 1.1rem;
        font-weight: bold;
        color: #f8fafc;
      }

      .status {
        margin-top: 20px;
        text-align: center;
        color: #bae6fd;
        font-size: 0.95rem;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1>Weather Location Search</h1>
        <p>Nama: Muhammad Fawwaz Naufal Dzulfikar | NIM: 20240140122</p>
      </div>

      <form id="searchForm" class="search-box">
        <input id="cityInput" type="text" value="jakarta" placeholder="Masukkan nama kota..." />
        <button type="submit">Cari</button>
      </form>

      <div class="result-grid">
        <div class="card">
          <span class="label">Lokasi</span>
          <div id="lokasi" class="value">-</div>
        </div>
        <div class="card">
          <span class="label">Negara</span>
          <div id="negara" class="value">-</div>
        </div>
        <div class="card">
          <span class="label">Provinsi</span>
          <div id="provinsi" class="value">-</div>
        </div>
        <div class="card">
          <span class="label">Kecamatan</span>
          <div id="kecamatan" class="value">-</div>
        </div>
        <div class="card">
          <span class="label">Longitude</span>
          <div id="longitude" class="value">-</div>
        </div>
        <div class="card">
          <span class="label">Latitude</span>
          <div id="latitude" class="value">-</div>
        </div>
      </div>

      <div id="status" class="status">Memuat data...</div>
    </div>

    <script>
      const searchForm = document.getElementById('searchForm');
      const cityInput = document.getElementById('cityInput');
      const status = document.getElementById('status');

      function setValue(id, value) {
        document.getElementById(id).textContent = value ?? '-';
      }

      function getLocation(city) {
        status.textContent = 'Memuat data...';

        fetch(`/api/lokasi?city=${encodeURIComponent(city)}`)
          .then((response) => response.json())
          .then((data) => {
            if (data.message) {
              status.textContent = data.message;
              return;
            }

            setValue('lokasi', data.lokasi);
            setValue('negara', data.negara);
            setValue('provinsi', data.provinsi);
            setValue('kecamatan', data.kecamatan);
            setValue('longitude', data.longitude);
            setValue('latitude', data.latitude);
            status.textContent = 'Data berhasil dimuat';
          })
          .catch((error) => {
            console.error(error);
            status.textContent = 'Gagal mengambil data';
          });
      }

      searchForm.addEventListener('submit', (event) => {
        event.preventDefault();
        const city = cityInput.value.trim();

        if (city) {
          getLocation(city);
        }
      });

      getLocation(cityInput.value.trim());
    </script>
  </body>
</html>
